<!doctype html>
<html lang="zh-CN" theme-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <link rel="icon" type="image/svg+xml" href="/brand/nexusauth-logo.svg" />
    <title>NexusAuth Workbench</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme-mode');
        var preferred = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('theme-mode', preferred);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', preferred === 'dark' ? '#101418' : '#f4f6f8');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
