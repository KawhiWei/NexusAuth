services:
  db:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-nexusauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusauth_dev_password}
      POSTGRES_DB: postgres
      # Development-only fallback. Production must explicitly set this value.
      WORKBENCH_CLIENT_SECRET: ${WORKBENCH_CLIENT_SECRET:-c57cf0e110c54ad2ac5591b99801b852}
    volumes:
      - nexusauth-db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/000-postgres-init.sh:ro
      - ./production-init.sql:/opt/nexusauth-init/production-init.sql:ro
      - ./admin/src/NexusAuth.Workbench.Api/seed.sql:/opt/nexusauth-init/admin-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  sso:
    build:
      context: .
      dockerfile: src/NexusAuth.Host/Dockerfile
    environment:
      TZ: Asia/Shanghai
      ASPNETCORE_ENVIRONMENT: ${NEXUSAUTH_SSO_ENVIRONMENT:-Development}
      NEXUSAUTH_CONNECTION_STRINGS_DEFAULT: Host=db;Port=5432;Database=nexusauth;Username=${POSTGRES_USER:-nexusauth};Password=${POSTGRES_PASSWORD:-nexusauth_dev_password};Search Path=nexusauth
      NEXUSAUTH_JWT_ISSUER: ${NEXUSAUTH_JWT_ISSUER:-http://localhost:5100}
      NEXUSAUTH_JWT_SIGNING_MODE: ${NEXUSAUTH_JWT_SIGNING_MODE:-Certificate}
      NEXUSAUTH_JWT_DEVELOPMENT_SIGNING_CERTIFICATE_PATH: App_Data/development-signing-certificate.pfx
      NEXUSAUTH_JWT_DEVELOPMENT_SIGNING_CERTIFICATE_PASSWORD: ${NEXUSAUTH_JWT_DEVELOPMENT_SIGNING_CERTIFICATE_PASSWORD:-nexusauth-compose-dev}
      NEXUSAUTH_JWT_SIGNING_CERTIFICATE_PATH: ${NEXUSAUTH_JWT_SIGNING_CERTIFICATE_PATH:-}
      NEXUSAUTH_JWT_SIGNING_CERTIFICATE_PASSWORD: ${NEXUSAUTH_JWT_SIGNING_CERTIFICATE_PASSWORD:-}
      NEXUSAUTH_JWT_DEVELOPMENT_SIGNING_KEY_PATH: App_Data/signing-key.json
      NEXUSAUTH_JWT_SIGNING_KEY_PATH: ${NEXUSAUTH_JWT_SIGNING_KEY_PATH:-}
      NEXUSAUTH_JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${NEXUSAUTH_JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      NEXUSAUTH_JWT_REFRESH_TOKEN_LIFETIME_MINUTES: ${NEXUSAUTH_JWT_REFRESH_TOKEN_LIFETIME_MINUTES:-43200}
      NEXUSAUTH_SLIDER_CAPTCHA_ENABLED: ${NEXUSAUTH_SLIDER_CAPTCHA_ENABLED:-false}
      NEXUSAUTH_SLIDER_CAPTCHA_CHALLENGE_LIFETIME_SECONDS: ${NEXUSAUTH_SLIDER_CAPTCHA_CHALLENGE_LIFETIME_SECONDS:-120}
      NEXUSAUTH_SLIDER_CAPTCHA_TOLERANCE_PIXELS: ${NEXUSAUTH_SLIDER_CAPTCHA_TOLERANCE_PIXELS:-5}
      NEXUSAUTH_SLIDER_CAPTCHA_TRACK_WIDTH_PIXELS: ${NEXUSAUTH_SLIDER_CAPTCHA_TRACK_WIDTH_PIXELS:-300}
      NEXUSAUTH_LOGIN_PAGE_BRAND_NAME: ${NEXUSAUTH_LOGIN_PAGE_BRAND_NAME:-NexusAuth}
      NEXUSAUTH_LOGIN_PAGE_BRAND_LOGO_URL: ${NEXUSAUTH_LOGIN_PAGE_BRAND_LOGO_URL:-/brand/nexusauth-logo.svg}
      NEXUSAUTH_LOGIN_PAGE_MARKETING_HEADING: ${NEXUSAUTH_LOGIN_PAGE_MARKETING_HEADING:-基于 OAuth 2.1 与 OIDC 的统一身份认证}
      NEXUSAUTH_LOGIN_PAGE_MARKETING_DESCRIPTION: ${NEXUSAUTH_LOGIN_PAGE_MARKETING_DESCRIPTION:-支持 OAuth 2.1、OpenID Connect（OIDC）、授权码 + PKCE 和 SCIM 2.0 标准协议。}
      NEXUSAUTH_LOGIN_PAGE_LOGIN_TITLE: ${NEXUSAUTH_LOGIN_PAGE_LOGIN_TITLE:-Sign In}
      NEXUSAUTH_LOGIN_PAGE_LOGIN_SUBTITLE: ${NEXUSAUTH_LOGIN_PAGE_LOGIN_SUBTITLE:-Please enter your details to sign in.}
      NEXUSAUTH_BOOTSTRAP_ADMIN_USERNAME: ${NEXUSAUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      NEXUSAUTH_BOOTSTRAP_ADMIN_PASSWORD: ${NEXUSAUTH_BOOTSTRAP_ADMIN_PASSWORD:-wzw0126..}
      NEXUSAUTH_BOOTSTRAP_ADMIN_NICKNAME: ${NEXUSAUTH_BOOTSTRAP_ADMIN_NICKNAME:-NexusAdmin}
      NEXUSAUTH_BOOTSTRAP_ADMIN_EMAIL: ${NEXUSAUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@163.com}
    volumes:
      - nexusauth-signing-key:/app/App_Data
      - nexusauth-sso-keys:/root/.aspnet/DataProtection-Keys
      - ./logs/sso:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5100:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: admin/src/NexusAuth.Workbench.Api/Dockerfile
    environment:
      TZ: Asia/Shanghai
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      NEXUSAUTH_WORKBENCH_CONNECTION_STRINGS_DEFAULT: Host=db;Port=5432;Database=nexusauth;Username=${POSTGRES_USER:-nexusauth};Password=${POSTGRES_PASSWORD:-nexusauth_dev_password};Search Path=nexusauth
      NEXUSAUTH_WORKBENCH_AUTH_AUTHORITY: ${NEXUSAUTH_JWT_ISSUER:-http://localhost:5100}
      NEXUSAUTH_WORKBENCH_AUTH_BACKCHANNEL_AUTHORITY: http://sso:8080
      NEXUSAUTH_WORKBENCH_AUTH_CLIENT_ID: nexusauth.workbench
      NEXUSAUTH_WORKBENCH_AUTH_CLIENT_SECRET: ${WORKBENCH_CLIENT_SECRET:-c57cf0e110c54ad2ac5591b99801b852}
      NEXUSAUTH_WORKBENCH_AUTH_REDIRECT_URI: http://localhost:5051/signin-oidc
      NEXUSAUTH_WORKBENCH_AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:5273/
      NEXUSAUTH_WORKBENCH_AUTH_SCOPE: openid profile workbench offline_access
      NEXUSAUTH_WORKBENCH_AUTH_AUDIENCE: workbench
      NEXUSAUTH_WORKBENCH_AUTH_REQUIRE_HTTPS_METADATA: "false"
      NEXUSAUTH_WORKBENCH_AUTH_SIGN_OUT_PROVIDER: "true"
    depends_on:
      db:
        condition: service_healthy
      sso:
        condition: service_healthy
    ports:
      - "5051:8080"
    volumes:
      - nexusauth-admin-keys:/root/.aspnet/DataProtection-Keys
      - ./logs/workbench:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: admin/src/NexusAuth.Workbench.Dashboard/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      TZ: Asia/Shanghai
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "5273:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  nexusauth-db-data:
  nexusauth-signing-key:
  nexusauth-sso-keys:
  nexusauth-admin-keys:
