<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490"><rect width="1200" height="490" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#596773"/></marker></defs><g fill="none" stroke="#596773" stroke-width="2" marker-end="url(#arrow)"><path d="M370 115 H420"/><path d="M770 115 H820"/><path d="M1000 190 V280"/><path d="M830 365 H780"/><path d="M430 365 H380"/></g><rect x="30" y="40" width="340" height="150" rx="4" fill="#e9f6f1" stroke="#596773" stroke-width="1.5"/><text x="200" text-anchor="middle" fill="#303b44" font-family="PingFang SC, Arial, sans-serif" font-size="18"><tspan x="200" y="100">1. Dashboard / 浏览器</tspan><tspan x="200" y="130">请求 /api/auth/login</tspan></text><rect x="430" y="40" width="340" height="150" rx="4" fill="#f4edfb" stroke="#596773" stroke-width="1.5"/><text x="600" text-anchor="middle" fill="#303b44" font-family="PingFang SC, Arial, sans-serif" font-size="18"><tspan x="600" y="85">2. Workbench API</tspan><tspan x="600" y="115">保存 state / nonce / PKCE</tspan><tspan x="600" y="145">返回 authorizeUrl</tspan></text><rect x="830" y="40" width="340" height="150" rx="4" fill="#edf1f5" stroke="#596773" stroke-width="1.5"/><text x="1000" text-anchor="middle" fill="#303b44" font-family="PingFang SC, Arial, sans-serif" font-size="18"><tspan x="1000" y="85">3. Provider 登录</tspan><tspan x="1000" y="115">/connect/authorize → /account/login</tspan><tspan x="1000" y="145">认证成功，返回 code / state</tspan></text><rect x="830" y="290" width="340" height="150" rx="4" fill="#f4edfb" stroke="#596773" stroke-width="1.5"/><text x="1000" text-anchor="middle" fill="#303b44" font-family="PingFang SC, Arial, sans-serif" font-size="18"><tspan x="1000" y="335">4. Workbench 回调</tspan><tspan x="1000" y="365">nginx 转发 /signin-oidc</tspan><tspan x="1000" y="395">校验并消费 state</tspan></text><rect x="430" y="290" width="340" height="150" rx="4" fill="#edf1f5" stroke="#596773" stroke-width="1.5"/><text x="600" text-anchor="middle" fill="#303b44" font-family="PingFang SC, Arial, sans-serif" font-size="18"><tspan x="600" y="320">5. 服务端换令牌</tspan><tspan x="600" y="350">POST /connect/token</tspan><tspan x="600" y="380">client_secret_basic + PKCE</tspan><tspan x="600" y="410">校验 ID Token，签发 Cookie</tspan></text><rect x="30" y="290" width="340" height="150" rx="4" fill="#e9f6f1" stroke="#596773" stroke-width="1.5"/><text x="200" text-anchor="middle" fill="#303b44" font-family="PingFang SC, Arial, sans-serif" font-size="18"><tspan x="200" y="335">6. 返回 Dashboard</tspan><tspan x="200" y="365">Cookie + 跳转 /auth/callback</tspan><tspan x="200" y="395">/api/auth/me → 管理页面</tspan></text><text x="1055" y="235" font-family="PingFang SC, Arial, sans-serif" font-size="17" fill="#303b44">浏览器回调</text></svg>
